<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Bird Map</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="controlPanel">

    <button id="listButton">
        種一覧
    </button>

    <button id="statsButton">
    統計
    </button>

    <hr>

    <hr>

    <input
        type="text"
        id="searchBox"
        placeholder="地名を入力"
    >

    <button id="searchButton">
        検索
    </button>

    <br><br>

    <hr>

    <button id="exportButton">
        バックアップ保存
    </button>
    <button id="importButton">
        復元
    </button>

    <input
        type="file"
        id="importFile"
        style="display:none"
    >

</div>

    <div id="speciesList"></div>

    <div id="statsPanel" style="
display:none;
position:absolute;
top:60px;
right:10px;
background:white;
padding:10px;
border:1px solid black;
box-shadow:0 0 10px rgba(0,0,0,0.3);
border-radius:8px;
z-index:1000;
max-height:400px;
overflow:auto;
width:300px;
">

<h3>統計</h3>

<button onclick="showBasicStats()">
基本統計
</button>

<button onclick="showRankingStats()">
観察数ランキング
</button>

<button onclick="
document.getElementById('statsPanel').style.display='none'
">
閉じる
</button>

<hr>

<div id="statsContent"></div>

</div>
<div id="birdForm" style="
display:none;
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
padding:15px;
border:1px solid black;
z-index:2000;
">

<h3>観察記録</h3>

鳥名<br>
<input type="text" id="birdNameInput"><br><br>

観察日<br>
<input type="date" id="birdDateInput"><br><br>

<button id="saveBirdButton">保存</button>
<button id="cancelBirdButton">キャンセル</button>

</div>

<div id="birdDetail" style="
display:none;
position:absolute;
top:60px;
right:10px;
width:300px;
max-height:500px;
overflow:auto;
background:white;
padding:10px;
border:1px solid black;
border-radius:8px;
box-shadow:0 0 10px rgba(0,0,0,0.3);
z-index:1500;
">

<button onclick="
document.getElementById('birdDetail').style.display='none'
">
閉じる
</button>

<div id="birdDetailContent"></div>




<div id="statsContent"></div>

</div>

</div>
    <div id="map"></div>



<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<div id="modalOverlay">

    <div id="datePanel">

        <h3>期間設定</h3>

        開始日<br>
        <input
            type="date"
            id="startDate"
        >

        <br><br>

        終了日<br>

        <input
            type="date"
            id="endDate"
        >

        <br><br>

        <button onclick="setThisMonth()">
            今月
        </button>

        <button onclick="setThisYear()">
            今年
        </button>

        <br><br>

        <button onclick="toggleDatePanel()">
            閉じる
        </button>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="script.js"></script>


</body>
</html>
